  catch(err){
    document.body.classList.remove('auth-pending');
    if(window.Swal)await Swal.fire({icon:err.code==='NO_OPEN_EXAM'?'warning':'error',title:err.code==='NO_OPEN_EXAM'?'Chưa có đề được mở':'Không tải được bài',text:err.message||'Kiểm tra file JSON.',confirmButtonColor:'#2563eb'});else alert(err.message||'Không tải được bài.');
    if(err.code==='NO_OPEN_EXAM')location.href='index.html#practices';
  }
}
init();
</script>
</body>
</html>
